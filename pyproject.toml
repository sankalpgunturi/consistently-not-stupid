[project]
name = "common-sense-trade"
version = "0.1.0"
description = "Consistently Not Stupid: a paper desk for high-probability Kalshi contracts."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Sankalp Gunturi"}]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.4",
  "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cst = "cst.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cst = ["dashboard/*.html", "dashboard/*.css", "dashboard/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
