<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Consistently Not Stupid</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%231a1714' width='32' height='32' rx='6'/%3E%3Cpath d='M6 20h20M8 16c2-6 14-6 16 0' stroke='%23d7a15e' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Consistently Not Stupid</h1>
    </div>
    <div class="top-meta">
      <button type="button" id="live" class="btn ghost" disabled title="Live order execution is not implemented">Switch to live trading</button>
      <button type="button" id="pause" class="btn ghost">Pause buys</button>
    </div>
  </header>

  <main>
    <section class="stats" id="stats" aria-label="Account performance"></section>
    <div class="thesis status-line">
      <span id="run-summary" role="status">Paper</span>
      <span id="next">Next scan —</span>
    </div>

    <section class="card balance-chart">
      <div class="card-head"><h2>Profit after fees</h2><span id="profit-total" class="num"></span></div>
      <svg id="equity" viewBox="0 0 1100 240" role="img" aria-label="Cumulative profit and loss from completed trades"></svg>
      <p id="profit-empty" class="empty">No completed trades yet.</p>
    </section>

    <section class="layout trades-layout">
      <article class="card">
        <div class="card-head"><h2>Trades</h2></div>
        <div class="table-wrap"><table class="trade-history">
          <colgroup><col style="width:36%"><col style="width:6%"><col style="width:12%"><col style="width:8%"><col style="width:8%"><col style="width:10%"><col style="width:10%"><col style="width:10%"></colgroup>
          <thead><tr><th>Trade</th><th>Pick</th><th>Entry probability</th><th>Paid</th><th>Status</th><th>Profit</th><th>Opened</th><th>Close</th></tr></thead>
          <tbody id="trades"></tbody>
        </table></div>
        <p class="expected-note">* Expected close / profit if won</p>
        <p class="empty" id="trades-empty">None</p>
        <button type="button" class="more-trades hidden" id="more-trades" aria-label="Show 5 more trades" title="Show more trades"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      </article>
    </section>

    <details class="card disclosure settings">
      <summary>Settings</summary>
      <div class="knobs" id="knobs"></div>
    </details>

  </main>
  <footer class="foot"><p>Kalshi paper trading</p></footer>
  <script src="/static/app.js"></script>
</body>
</html>
